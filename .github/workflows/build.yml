name: Build QR Generator 🐹

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dando permisos a Gradle
        run: chmod +x gradlew

      - name: Ejecutar Shadowjar
        run: ./gradlew shadowJar

      - name: Subiendo artefacto cuyico
        uses: actions/upload-artifact@v4
        with:
          name: QRGenerator
          path: build/libs/*-all.jar
          retention-days: 5
      
      
